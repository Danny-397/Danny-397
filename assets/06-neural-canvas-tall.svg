<svg xmlns="http://www.w3.org/2000/svg" width="600" height="598" viewBox="0 0 600 598" role="img" aria-labelledby="title-06-neural-canvas">
<title id="title-06-neural-canvas">Neural Canvas</title>
<style>
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  .r { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .f { animation: fade .6s ease-out both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .d { animation: draw 1.6s cubic-bezier(.4,0,.2,1) both; }
  @keyframes spin { to { transform: translate(802px, 125px) rotate(360deg); } }
  .spin { transform: translate(802px, 125px); animation: spin 90s linear infinite; }
</style>
<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
